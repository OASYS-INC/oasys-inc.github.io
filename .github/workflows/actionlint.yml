
name: Lint GitHub Actions workflows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lint workflow files
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
